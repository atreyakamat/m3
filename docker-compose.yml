services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-m3}
      POSTGRES_USER: ${POSTGRES_USER:-m3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-prod}
    ports:
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - m3_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-m3} -d ${POSTGRES_DB:-m3}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-m3}:${POSTGRES_PASSWORD:-change-me-in-prod}@db:5432/${POSTGRES_DB:-m3}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-chars-long-xx}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-dev-bootstrap-secret}
      PORT: 8003
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "${PORT:-8003}:8003"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8003/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  m3_pgdata:
