# Release validation environment — fully isolated from the m3-compose shared stack.
# Project: m3rel  (docker compose -p m3rel -f scripts/release-validation/compose.validation.yml ...)
# - Unique container names, ports, network, volume.
# - Fresh PostgreSQL (engine of record), explicit M3_DATABASE_MODE=postgres.
# - Disposable only: `down -v` removes everything created here.
# NOTE: DATABASE_URL is assembled inside compose (not echoed in logs/reports).
name: m3val  # compose project name baked-in (no -p needed, but -p also fine)

services:
  db:
    image: postgres:16-alpine
    container_name: m3val-postgres
    environment:
      POSTGRES_DB: ${M3VAL_PG_DB:-m3_val_release}
      POSTGRES_USER: ${M3VAL_PG_USER:-m3val_user}
      POSTGRES_PASSWORD: ${M3VAL_PG_PASSWORD:-m3val_change_me_local_only}
    volumes:
      - m3val-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [m3val-net]

  kafka:
    image: apache/kafka:3.7.0
    container_name: m3val-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: M3VALCLUSTERID001
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 40s
    networks: [m3val-net]

  api:
    build: ../../services/api
    container_name: m3val-api
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8004:8000"
    environment:
      # Disposable PostgreSQL ONLY — never the shared m3_compose_dev database.
      DATABASE_URL: postgresql+psycopg://${M3VAL_PG_USER:-m3val_user}:${M3VAL_PG_PASSWORD:-m3val_change_me_local_only}@db:5432/${M3VAL_PG_DB:-m3_val_release}
      M3_DATABASE_MODE: postgres
      JWT_SECRET: m3val-jwt-secret-dev-disposable
      BOOTSTRAP_SECRET: m3val-bootstrap-secret
      # Isolated console origin for browser validation (5174):
      API_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://192.168.1.153:5174
      PORT: 8000
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: m3val.events
    # Migrations + seed run ONLY against the disposable database above.
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [m3val-net]

  web:
    build:
      context: ../../apps/web
      args:
        # Built console talks to the ISOLATED API on 8004 (host-side mapping).
        VITE_API_BASE_URL: http://localhost:8004/api/v1
    container_name: m3val-web
    depends_on:
      - api
    ports:
      - "5174:80"
    networks: [m3val-net]

  # Database-mode safety regression: same image, validation-only mode with a
  # deliberately stale DATABASE_URL that must never be contacted.
  api-none:
    build: ../../services/api
    container_name: m3val-api-none
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "8005:8000"
    environment:
      M3_DATABASE_MODE: none
      # Stale/unreachable URL on purpose (never contacted; never logged).
      DATABASE_URL: postgresql+psycopg://stale:stale@host.invalid:5432/never_target
      JWT_SECRET: m3val-jwt-secret-dev-disposable
      BOOTSTRAP_SECRET: m3val-bootstrap-secret
      API_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      PORT: 8000
      KAFKA_ENABLED: "false"
    # No alembic/seed in validation-only mode.
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [m3val-net]

volumes:
  m3val-postgres-data:

networks:
  m3val-net:
    driver: bridge
